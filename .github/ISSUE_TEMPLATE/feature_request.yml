name: Feature request
description: Propose a behavior or improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the use case and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives and device/provider constraints if relevant.
    validations:
      required: true
