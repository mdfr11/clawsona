[project]
name = "clawsona"
version = "0.3.0"
description = "Voice companion for OpenClaw with local speech recognition and a configurable identity"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
keywords = ["openclaw", "voice-assistant", "speech-recognition", "piper", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "aiohttp>=3.10.0",
    "pydantic-settings>=2.7.0",
    "faster-whisper>=1.2.1,<2",
    # faster-whisper 1.2 uses av.open(metadata_errors=...), removed in new PyAV.
    "av>=11,<17",
    "piper-tts>=1.5,<2",
]

[project.optional-dependencies]
music = ["yandex-music>=2.2,<4"]
cloud-speech = [
    "deepgram-sdk>=7.3,<8",
    "edge-tts>=7.2,<8",
    "pydub>=0.25.0",
    "audioop-lts>=0.2.1 ; python_full_version >= '3.13'",
]

[project.scripts]
clawsona = "clawsona.main:main"
lyutik = "clawsona.main:main"

[project.urls]
Homepage = "https://mdfr11.github.io/clawsona/"
Repository = "https://github.com/mdfr11/clawsona"
Documentation = "https://github.com/mdfr11/clawsona#quick-start"
Issues = "https://github.com/mdfr11/clawsona/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawsona", "src/lyutik"]

[tool.hatch.build.targets.wheel.force-include]
"openclaw/clawsona-tools" = "clawsona/openclaw_plugin"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/openclaw", "/deploy", "/docs", "/.github", "/website",
    "/.env.example", "/.gitignore", "/README.md", "/CONTRIBUTING.md",
    "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/uv.lock",
]
exclude = [
    "__pycache__", "*.pyc", "*.onnx", "*.onnx.json", "*.bin", "*.wav",
    "*.mp3", "*.part", "*.log", "*.log.*", ".DS_Store", "/website/dist", "/website/.preview",
]

[tool.hatch.build.targets.sdist.force-include]
"website/media/hello-ru.mp3" = "website/media/hello-ru.mp3"
"website/media/hello-en.mp3" = "website/media/hello-en.mp3"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
